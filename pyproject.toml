[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murmur"
version = "0.1.0"
description = "Captura inteligente de clases: transcripción Whisper, generación de apuntes con LLMs y exportación vía MCP a Notion, Obsidian y LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ismael Sallami", email = "ismEngineer23@gmail.com" },
    { name = "Alicia Ruiz", email = "aliciaruigo2004@gmail.com" },
]
keywords = [
    "murmur",
    "whisper",
    "speech-to-text",
    "lecture-notes",
    "mcp",
    "model-context-protocol",
    "obsidian",
    "notion",
    "latex",
    "tauri",
    "react",
    "llm",
    "education"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
local-whisper = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
murmur = "murmur.main:cli_main"
